<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SellerAgent - 销售智能体</title>
    <link rel="stylesheet" href="/static/css/style-v2.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- 顶部导航栏 -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <header class="header">
        <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleSidebar()" title="会话列表">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>
        <div class="header-title">
            <img src="/static/icons/bot.svg" class="icon-img" alt="" style="font-size:24px;">
            <span class="header-title-text">SellerAgent — 销售智能体</span>
            <span class="header-title-short">SellerAgent</span>
        </div>
        <div class="header-status">
            <span class="header-stat-item">知识库文档: <strong id="statDocs">-</strong> 条</span>
            <span class="header-stat-item">总字数: <strong id="statChars">-</strong></span>
            <span class="status-dot" id="statusDot" title="服务运行中"></span>
        </div>
        <button class="mobile-kb-btn" id="mobileKbBtn" onclick="toggleKBPanel()" title="知识库">
            <img src="/static/icons/docs.svg" class="icon-img" alt="" style="font-size:20px;">
        </button>
    </header>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- 主布局：左右两栏 -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <div class="main-container">

        <!-- ─── 左侧：会话列表 ─── -->
        <div class="session-sidebar" id="sessionSidebar">
            <div class="session-sidebar-header">
                <button class="mobile-panel-close" onclick="toggleSidebar()" title="关闭">✕</button>
                <span class="session-sidebar-label">会话列表</span>
                <button class="btn btn-primary btn-sm" onclick="newThread()" style="width:100%;">
                    <img src="/static/icons/add.svg" class="icon-img" alt=""> 新建对话
                </button>
            </div>
            <div class="session-list" id="sessionList">
                <div class="empty-state" style="padding:16px;">
                    <p style="font-size:12px;">加载中...</p>
                </div>
            </div>
        </div>

        <!-- ─── 中间：对话面板 ─── -->
        <div class="chat-panel">
            <div class="chat-messages" id="chatMessages">
            </div>

            <div class="chat-input-area">
                <div class="chat-input-row">
                    <textarea
                        id="chatInput"
                        class="chat-input"
                        placeholder="输入您的销售问题，例如：这个产品有什么优势？怎么介绍给客户？..."
                        rows="1"
                    ></textarea>
                    <button id="sendBtn" class="btn-send">发送</button>
                </div>
            </div>
        </div>

        <!-- ─── 右侧：知识库管理面板 ─── -->
        <div class="kb-panel" id="kbPanel">

            <!-- 统计概览 -->
            <div class="kb-section">
                <div class="kb-section-title">
                    <button class="mobile-panel-close" onclick="toggleKBPanel()" title="关闭">✕</button>
                    <img src="/static/icons/overview_line.svg" class="icon-img" alt=""> 知识库概览
                </div>
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-value" id="statDocsPanel">-</div>
                        <div class="stat-label">知识文档数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statCharsPanel">-</div>
                        <div class="stat-label">总字数</div>
                    </div>
                </div>
            </div>

            <!-- 添加知识 -->
            <div class="kb-section">
                <div class="kb-section-title"><img src="/static/icons/add.svg" class="icon-img" alt=""> 添加知识</div>
                <div class="kb-add-form">
                    <!-- 文本输入 -->
                    <div class="form-group">
                        <label class="form-label">文档标题</label>
                        <input
                            id="docTitle"
                            class="form-input"
                            type="text"
                            placeholder="例如：产品卖点总结、常见客户异议处理..."
                        >
                    </div>
                    <div class="form-group">
                        <label class="form-label">文档内容</label>
                        <textarea
                            id="docContent"
                            class="form-textarea"
                            placeholder="在此粘贴产品资料、销售话术、FAQ等文本内容..."
                        ></textarea>
                        <div class="form-hint">支持粘贴纯文本、Markdown 格式内容</div>
                    </div>
                    <div class="form-group">
                        <button id="btnAddDoc" class="btn btn-primary btn-block">
                            <img src="/static/icons/add.svg" class="icon-img" alt=""> 添加到知识库
                        </button>
                    </div>

                    <!-- 分隔线 -->
                    <div style="text-align:center;margin:12px 0;color:var(--text-muted);font-size:12px;">
                        — 或者上传文件 —
                    </div>

                    <!-- 文件上传 -->
                    <div class="form-group">
                        <input
                            type="file"
                            id="fileUpload"
                            class="file-upload-input"
                            accept=".txt,.md,.pdf,.docx,.xlsx,.pptx,.html,.png,.jpg,.jpeg"
                        >
                        <div
                            id="uploadArea"
                            class="btn-upload"
                            onclick="triggerFileUpload()"
                        >
                            <img src="/static/icons/upload.svg" class="icon-img" alt=""> 点击上传文件<br>
                            <small>支持 .txt .md .pdf .docx .xlsx .pptx .html .png .jpg</small>
                        </div>
                        <!-- 上传进度条 -->
                        <div id="uploadProgress" class="upload-progress" style="display:none;">
                            <div class="progress-bar-wrapper">
                                <div class="progress-bar-fill" id="progressBarFill"></div>
                            </div>
                            <div class="progress-text" id="progressText">准备上传...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 文档列表 -->
            <div class="kb-section" style="flex:1; overflow-y: auto;">
                <div class="kb-section-title">
                    <img src="/static/icons/docs.svg" class="icon-img" alt=""> 知识文档列表
                    <button class="btn btn-sm" style="margin-left:auto;" onclick="refreshDocList();refreshStats();">
                        <img src="/static/icons/refresh.svg" class="icon-img" alt=""> 刷新
                    </button>
                </div>
                <div class="doc-list" id="docList">
                    <div class="empty-state">
                        <div class="icon"><img src="/static/icons/loading.svg" class="icon-img" alt="" style="font-size:40px;"></div>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- 移动端遮罩层 -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="closeAllPanels()"></div>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- 文档内容弹窗 -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <div id="docModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">文档内容</span>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="loading"></div> 加载中...
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- 脚本 -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <script src="/static/js/app.js"></script>
</body>
</html>
